version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: beautybot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: beautybot
      POSTGRES_PASSWORD: beautybot
      POSTGRES_DB: beautybot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beautybot -d beautybot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
